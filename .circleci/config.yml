version: 2
jobs:
  build-core:
    docker:
      - image: cimg/openjdk:18.0.2

    working_directory: ~/repo

    environment:
      # Customize the JVM maximum heap limit
      JVM_OPTS: -Xmx3200m
      TERM: bash

    steps:
      - checkout

      - restore_cache:
          keys:
          - v1-dependencies-{{ checksum "tzio-core/build.gradle" }}
          # fallback to using the latest cache if no exact match is found
          - v1-dependencies-

      - run:
          command: gradle dependencies
          working_directory: ~/repo/tzio-core
          environment:
            TERM: dumb

      - save_cache:
          key: v1-dependencies-{{ checksum "tzio-core/build.gradle" }}
          paths:
            - ~/repo/tzio-core/.gradle

      # run tests!
      - run:
          command: gradle test
          working_directory: ~/repo/tzio-core
          environment:
            TERM: dumb

  build-rs-parser:
    docker:
      - image: cimg/rust:1.94.1

    working_directory: ~/repo

    steps:
      - checkout

      - restore_cache:
          keys:
          - v2-cargo-{{ checksum "rs-parser/Cargo.lock" }}
          - v2-cargo-

      - run:
          command: cargo fmt --check
          working_directory: ~/repo/rs-parser

      - run:
          command: cargo clippy --all-targets --locked -- -D warnings
          working_directory: ~/repo/rs-parser

      - run:
          command: cargo test --locked
          working_directory: ~/repo/rs-parser

      - save_cache:
          key: v2-cargo-{{ checksum "rs-parser/Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/repo/rs-parser/target

  # Checks the minimal Rust version declared in rs-parser/Cargo.toml
  build-rs-parser-msrv:
    docker:
      - image: cimg/rust:1.85.0

    working_directory: ~/repo

    steps:
      - checkout

      - run:
          command: cargo test --locked
          working_directory: ~/repo/rs-parser

  build-java-reader:
    docker:
      - image: circleci/rust:1.26.2-stretch

    working_directory: ~/repo

    steps:
      - checkout

      - run:
          command: cargo test
          working_directory: ~/repo/java-reader

workflows:
  version: 2

  build_all:
    jobs:
      - build-core
      - build-rs-parser
      - build-rs-parser-msrv
      - build-java-reader
