version: 2.1
jobs:
  build-core:
    docker:
      - image: cimg/openjdk:26.0.2

    working_directory: ~/repo

    environment:
      # Customize the JVM maximum heap limit
      JVM_OPTS: -Xmx3200m
      TERM: dumb

    steps:
      - checkout

      - restore_cache:
          keys:
          - v2-gradle-{{ checksum "tzio-core/gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "tzio-core/gradle/libs.versions.toml" }}
          - v2-gradle-

      - run:
          command: ./gradlew build
          working_directory: ~/repo/tzio-core

      - save_cache:
          key: v2-gradle-{{ checksum "tzio-core/gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "tzio-core/gradle/libs.versions.toml" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

  build-rs-parser:
    docker:
      - image: cimg/rust:1.94.1

    working_directory: ~/repo

    steps:
      - checkout

      - restore_cache:
          keys:
          - v2-cargo-{{ checksum "rs-parser/Cargo.lock" }}
          - v2-cargo-

      - run:
          command: cargo fmt --check
          working_directory: ~/repo/rs-parser

      - run:
          command: cargo clippy --all-targets --locked -- -D warnings
          working_directory: ~/repo/rs-parser

      - run:
          command: cargo test --locked
          working_directory: ~/repo/rs-parser

      - save_cache:
          key: v2-cargo-{{ checksum "rs-parser/Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/repo/rs-parser/target

  # Checks the minimal Rust version declared in rs-parser/Cargo.toml
  build-rs-parser-msrv:
    docker:
      - image: cimg/rust:1.85.0

    working_directory: ~/repo

    steps:
      - checkout

      - run:
          command: cargo test --locked
          working_directory: ~/repo/rs-parser

  build-java-reader:
    docker:
      - image: circleci/rust:1.26.2-stretch

    working_directory: ~/repo

    steps:
      - checkout

      - run:
          command: cargo test
          working_directory: ~/repo/java-reader

workflows:
  build_all:
    jobs:
      - build-core
      - build-rs-parser
      - build-rs-parser-msrv
      - build-java-reader
