plugins {
    alias(libs.plugins.lombok) apply false
}

ext {
    javaVersion = 26
}

allprojects {
    repositories {
        mavenCentral()
    }

    group = 'com.kineolyan'
    version = '1.2-SNAPSHOT'
}

// Captured for the subprojects: they cannot look it up from the root project
def catalog = libs

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.freefair.lombok'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(rootProject.javaVersion)
        }
    }

    lombok {
        version = catalog.versions.lombok
    }

    dependencies {
        implementation platform(catalog.junit.bom)
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        failFast = false
    }
}
